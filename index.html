<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLSM Kedah Evaluation Portal</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #f8fafc; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
    .btn {
      display: block;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://lh3.googleusercontent.com/d/1gRcpYsMe4j9wEI9WDQmnwFwVFPenox86" alt="TLSM Logo" style="height: 60px; margin-bottom: 15px;">
    <h1>TRAUMA LIFE SUPPORT EVALUATION</h1>
    <p>TLSM Kedah Diagnostic Grading System</p>
    <a href="https://script.google.com/macros/s/AKfycbxZuhajdf5Pup9DCYCK4iVWpSOCpnY2i_UQy9zGYBcimlMZNO_Ox0y9kfwcvmTOAqS0/exec" class="btn">LAUNCH SYSTEM 🚀</a>
  </div>

</body>
</html>
