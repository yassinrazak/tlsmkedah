<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLSM Kedah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    .iframe-container {
      width: 100vw;
      height: 100vh;
      border: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="iframe-container" id="appWrapper">
    <!-- Frame will be dynamically injected here -->
  </div>

  <script>
    // Exact URL of your published Apps Script Web App
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxZuhajdf5Pup9DCYCK4iVWpSOCpnY2i_UQy9zGYBcimlMZNO_Ox0y9kfwcvmTOAqS0/exec";

    window.addEventListener('DOMContentLoaded', () => {
      const wrapper = document.getElementById('appWrapper');
      const iframe = document.createElement('iframe');
      
      // Setting iframe attributes
      iframe.src = webAppUrl;
      iframe.setAttribute('allow', 'fullscreen; geolocation; microphone; camera');
      iframe.setAttribute('sandbox', 'allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts');
      
      wrapper.appendChild(iframe);
    });
  </script>

</body>
</html>
