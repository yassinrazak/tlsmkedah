<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxZuhajdf5Pup9DCYCK4iVWpSOCpnY2i_UQy9zGYBcimlMZNO_Ox0y9kfwcvmTOAqS0/exec";
  var currentUser = { username: "", fullName: "" };

  // 🌐 JSONP Engine: Completely Bypasses CORS Blocking
  function jsonpRequest(action, payload) {
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);
        resolve(data);
      };

      const script = document.createElement('script');
      const encodedPayload = encodeURIComponent(JSON.stringify(payload || {}));
      script.src = `${API_URL}?action=${action}&payload=${encodedPayload}&callback=${callbackName}`;
      
      script.onerror = function() {
        delete window[callbackName];
        document.body.removeChild(script);
        reject(new Error("JSONP Request Failed"));
      };

      document.body.appendChild(script);
    });
  }

  function apiPost(action, payload) {
    return jsonpRequest(action, payload)
      .catch(err => {
        alert("Connection Error: Unable to reach Google Database.");
        console.error("API Error:", err);
      });
  }

  function loadParticipantsDropdown() {
    jsonpRequest('getParticipants', {})
      .then(res => {
        if (res && res.success) {
          var select = document.getElementById('participantSelect');
          select.innerHTML = '<option value="">-- Choose Participant --</option>';
          res.participants.forEach(p => {
            var opt = document.createElement('option');
            opt.value = p.fullName;
            opt.textContent = p.fullName;
            select.appendChild(opt);
          });
        }
      })
      .catch(err => console.error("Participant fetch error:", err));
  }

  function registerUser() {
    var payload = {
      name: document.getElementById('regName').value,
      username: document.getElementById('regUsername').value,
      password: document.getElementById('regPassword').value,
      mykad: document.getElementById('regMykad').value,
      email: document.getElementById('regEmail').value
    };

    if (!payload.name || !payload.username || !payload.password || !payload.mykad || !payload.email) {
      alert("Please fill in all registration fields!");
      return;
    }

    apiPost("register", payload).then(res => {
      if (!res) return;
      alert(res.message);
      if (res.success) {
        currentUser.username = res.username;
        currentUser.fullName = res.fullName;
        document.getElementById('displayUsername').textContent = currentUser.username;
        document.getElementById('regForm').reset();
        loadParticipantsDropdown();
        showView('examView');
      }
    });
  }

  function loginUser() {
    var u = document.getElementById('loginUsername').value;
    var p = document.getElementById('loginPassword').value;

    if (!u || !p) {
      alert("Please enter both username and password!");
      return;
    }

    apiPost("login", { username: u, password: p }).then(res => {
      if (!res) return;
      if (res.success) {
        currentUser.username = res.username;
        currentUser.fullName = res.fullName;
        document.getElementById('displayUsername').textContent = currentUser.username;
        document.getElementById('loginForm').reset();
        loadParticipantsDropdown();
        showView('examView');
      } else {
        alert(res.message);
      }
    });
  }

  function sendPasswordEmail() {
    var email = document.getElementById('forgotEmail').value;
    if (!email) {
      alert("Please enter your registered email address!");
      return;
    }

    apiPost("recoverPassword", { email: email }).then(res => {
      if (!res) return;
      alert(res.message);
      if (res.success) {
        document.getElementById('forgotForm').reset();
        showView('loginView');
      }
    });
  }

  function logout() {
    currentUser = { username: "", fullName: "" };
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('mcqForm').reset();
    showView('loginView');
  }

  function submitExam() {
    var questionSet = document.getElementById('setSelect').value;
    var participantName = document.getElementById('participantSelect').value;

    if (!participantName) {
      alert("Please select a Participant Name from the list!");
      return;
    }

    saveSetPreference();

    var answers = {};
    for (var i = 1; i <= 50; i++) {
      var sel = document.querySelector(`input[name="ans_q${i}"]:checked`);
      if (!sel) {
        alert(`Please select an answer for Question ${i}`);
        return;
      }
      answers[`q${i}`] = sel.value;
    }

    apiPost("submitExam", {
      questionSet: questionSet,
      participantName: participantName,
      evaluatorUsername: currentUser.username,
      answers: answers
    }).then(res => {
      if (!res) return;
      var card = document.getElementById('resultCard');
      card.className = res.status;
      card.style.display = 'block';
      card.innerHTML = `
        <h2 style="margin:0 0 8px 0; color: inherit;">RESULT (${res.set}): ${res.score} / ${res.total} (${res.percentage}%)</h2>
        <p style="margin: 0; font-weight: 600;">Participant: ${res.participant} | Status: ${res.status}</p>
        <p style="font-size: 12px; margin-top: 4px; opacity: 0.8;">(Saved to Google Sheet)</p>
      `;
      document.getElementById('mcqForm').reset();
      loadSetPreference();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });
  }

  function loadSetPreference() {
    var savedSet = localStorage.getItem('tlsm_selected_set');
    if (savedSet) { document.getElementById('setSelect').value = savedSet; }
  }

  function saveSetPreference() {
    var currentSet = document.getElementById('setSelect').value;
    localStorage.setItem('tlsm_selected_set', currentSet);
  }

  function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    if (viewId === 'examView') { loadSetPreference(); }
  }

  function createQuestionCard(num) {
    var card = document.createElement('div');
    card.className = 'q-card';
    var optionsHtml = ['A', 'B', 'C', 'D', 'E'].map(opt => `
      <label class="pill-btn">
        <input type="radio" name="ans_q${num}" value="${opt}">
        <span>${opt}</span>
      </label>
    `).join('');
    card.innerHTML = `<div class="q-num-label">Q${num}</div><div class="pill-group">${optionsHtml}</div>`;
    return card;
  }

  const col1 = document.getElementById('colStream1');
  const col2 = document.getElementById('colStream2');
  const col3 = document.getElementById('colStream3');
  const col4 = document.getElementById('colStream4');

  for (let i = 1; i <= 13; i++) { col1.appendChild(createQuestionCard(i)); }
  for (let i = 14; i <= 25; i++) { col2.appendChild(createQuestionCard(i)); }
  for (let i = 26; i <= 38; i++) { col3.appendChild(createQuestionCard(i)); }
  for (let i = 39; i <= 50; i++) { col4.appendChild(createQuestionCard(i)); }
</script>
