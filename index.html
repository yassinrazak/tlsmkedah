<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLSM Kedah Evaluation Portal</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.97);
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 15px 10px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: var(--glass-bg);
      padding: 30px 25px 20px 25px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .main-logo { height: 70px; margin-bottom: 15px; }
    h2 { color: #1e1b4b; margin: 0 0 4px 0; font-size: 24px; font-weight: 800; }
    p.subtitle { color: #64748b; margin-bottom: 25px; font-size: 14px; }
    .launch-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.25);
    }
    .footer-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 25px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .footer-logo { max-height: 36px; }
    .footer-text { text-align: right; font-size: 11px; color: #94a3b8; }
    #appFrame { display: none; width: 100vw; height: 100vh; border: none; position: fixed; top: 0; left: 0; z-index: 999; }
  </style>
</head>
<body>

<div class="container" id="landingCard">
  <img src="https://lh3.googleusercontent.com/d/1gRcpYsMe4j9wEI9WDQmnwFwVFPenox86" class="main-logo">
  <h2>TRAUMA LIFE SUPPORT EVALUATION</h2>
  <p class="subtitle">TLSM – Kedah Diagnostic Grading System</p>

  <button class="launch-btn" onclick="openSystem()">LAUNCH SYSTEM 🚀</button>

  <footer class="footer-container">
    <div style="display:flex; gap:8px;">
      <img src="https://lh3.googleusercontent.com/d/1gRcpYsMe4j9wEI9WDQmnwFwVFPenox86" class="footer-logo">
      <img src="https://lh3.googleusercontent.com/d/1Bq6Oyc9cf-bihnZS03qLiAEzoFFj29Io" class="footer-logo">
      <img src="https://lh3.googleusercontent.com/d/1TiqQcTeY3kTAYYs5visup6_qPC5vu7c4" class="footer-logo">
    </div>
    <div class="footer-text">
      © 2026 Dr. Yassin Razak<br>TLSM – Kedah
    </div>
  </footer>
</div>

<!-- Embedded App Target -->
<iframe id="appFrame" src=""></iframe>

<script>
  function openSystem() {
    const frame = document.getElementById('appFrame');
    // Loads in-place without changing URL bar
    frame.src = "https://script.google.com/macros/s/AKfycbxZuhajdf5Pup9DCYCK4iVWpSOCpnY2i_UQy9zGYBcimlMZNO_Ox0y9kfwcvmTOAqS0/exec";
    frame.style.display = "block";
  }
</script>

</body>
</html>
